# Anvil configuration
# Most settings have sensible defaults. The only required setting is identity.wif,
# which should be set via ANVIL_IDENTITY_WIF env var (not in this file).

[node]
name = "my-anvil"
data_dir = "/var/lib/anvil"
listen = "0.0.0.0:8333"          # mesh peers — wss:// when TLS configured
api_listen = "0.0.0.0:9333"      # REST API — HTTPS when TLS configured
# public_url = "https://anvil.example.org" # public API URL used in overlay advertisements
# mode = "standard"               # label/default; [gateway] enabled controls runtime gateway mode

[identity]
# wif = ""                       # Set via ANVIL_IDENTITY_WIF env var, not here

[mesh]
seeds = [
  # "wss://peer1.example.com:8333",
]
# local_pubkeys = [
#   "0231600bb272175e990e1639cba5c8f0a8e8c820c7c1b446d2301b0950957f9f66",
# ]
# Use local_pubkeys for fast local publishers that should not trigger
# double-publish slashing on this node (for example, a local oracle feed).
# min_bond_sats = 0                # minimum confirmed bond required from a mesh peer
# bond_check_url = ""              # optional UTXO lookup endpoint for bond checks
# rate_per_sec = 30                # per-peer envelope rate
# rate_burst = 100                 # per-peer burst allowance
# allowed_peers = [
#   "0231600bb272175e990e1639cba5c8f0a8e8c820c7c1b446d2301b0950957f9f66",
# ]
# Closed-network mode: when set, a mesh peer (inbound or outbound) whose
# authenticated identity public key is not listed here is refused right
# after the handshake, before any of its messages are processed. Leave
# unset (the default) to accept any peer, as today.
# Certificate admission is disabled when this section is absent. Lists and maps
# default empty. Certifier keys are compressed identity keys; type IDs are
# 32-byte Base64 values.
# [certgate]
# certifiers = ["0231600bb272175e990e1639cba5c8f0a8e8c820c7c1b446d2301b0950957f9f66"]
# types = ["AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="]
# revocation_check = "strict"       # default; "strict" refuses lookup errors, "lazy" retries within 60s
# revocation_recheck = "1h"         # default
# [certgate.reveal_fields]
# "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=" = []
# While either certificate switch is on, clients must use @bsv/sdk (TypeScript):
# Go SDK v1.7.8 clients can't complete a certificate-requesting handshake here.
# [certgate.allow_unrevocable]
# "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=" = false

[gateway]
enabled = false                    # default
# api_host = ""                    # defaults to [node] public_url host; required when enabled
# sites_file = ""                  # defaults to gateway-sites.conf beside anvil.toml
# txt_cache_ttl = 300               # positive _ordfs answer cache, seconds
# txt_stale_grace = 86400           # serve the last good TXT answer after resolver errors
# root_max_age = 60                 # Cache-Control max-age for a site's /
# content_scope = "site"            # "site" (default) or unrestricted "any"
# https_listen = ":443"
# http_listen = ":80"               # ACME HTTP-01 and HTTPS redirects
# acme_directory = "https://acme-v02.api.letsencrypt.org/directory"
# acme_email = ""                   # no contact by default
# acme_accept_tos = false           # explicit opt-in required before certificate issuance
# allow_registration = false       # certificate-gated domain registration API
# With allow_registration or messaging.require_sender_certificate on, this
# node asks every BRC-31 client for a certificate during the shared handshake.
# A client without one cannot authenticate to any BRC-31 route on this node,
# including message reads. A send from an identity without a current admission
# reaches the handler but gets HTTP 403.

[bsv]
nodes = ["seed.bitcoinsv.io:8333"]
# header_sync_interval_secs = 30   # how often to poll BSV peers for new headers (default 30)
# header_stale_after_secs = 1800
# Default 1800s; a node behind by more than this consults the trusted fallback even if a P2P peer is still connected.
#
# Mesh header self-heal (ON by default). If ALL BSV P2P peers fail a sync round,
# or the stored tip is stale, it catches up over HTTPS from a TRUSTED Anvil peer. A
# canonical default (https://anvil.sendbsv.com) is baked into the binary, so this
# works after `anvil upgrade` with NO config edit — the same way the default BSV
# seeds above do. To ADD your own trusted peers (tried before the default), list
# them here; to turn the fallback off entirely, set header_fallback_disabled.
# TRUST NOTE: fetched headers are PoW + most-work validated but NOT difficulty-
# adjustment (DAA) validated — a listed peer is trusted to the same degree as a
# [bsv] node above, so any URL you add must be https:// (http:// allowed only for
# localhost). A healthy, advancing P2P tip never calls the fallback.
# header_fallback_peers = ["https://my-other-node.example"]
# header_fallback_disabled = false   # set true to disable the self-heal on this node

# ARC — GorillaPool is the default (free, no API key required)
[arc]
enabled = true
url = "https://arc.gorillapool.io"
# api_key = ""                    # primary ARC credential, when required
# TAAL failover (recommended but not required — set ANVIL_TAAL_API_KEY env var)
# taal_enabled = false
# taal_url = "https://arc.taal.com"
# taal_api_key = ""               # or set ANVIL_TAAL_API_KEY

# JungleBus — backwards-compatibility section only.
#
# Prior Anvil versions (<= v2.3.x) used JungleBus to subscribe to
# on-chain SHIP/SLAP admin tokens for federation discovery. v3.0.0
# retired that path in favor of canonical BRC-88 SHIP/SLAP via go-sdk's
# LookupResolver and the [overlay] ship_trackers / slap_trackers list
# below. The [junglebus] section is still accepted by the TOML parser
# so existing operator configs don't break, but every field below is a
# runtime no-op. Safe to delete this whole block when you next edit the
# config.
[junglebus]
enabled = false
url = "junglebus.gorillapool.io"

# Overlay federation — canonical BRC-88 SHIP/SLAP.
#
# enable_gasp_sync = true (default) means this node will:
#   * publish SHIP+SLAP advertisements on-chain for every hosted topic
#     via the canonical Advertiser + admin-token PushDrop
#   * discover federation peers via the configured SLAP trackers
#   * run periodic GASP sync to pull peer state
#
# ship_trackers / slap_trackers default to go-sdk's DEFAULT_SLAP_TRACKERS
# (Project Babbage's overlay-us-1.bsvb.tech, overlay-eu-1.bsvb.tech,
# overlay-ap-1.bsvb.tech, users.bapp.dev) when left blank. Override here
# to point at your own federation, a staging cluster, or a regional
# subset.
[overlay]
enabled = true
topics = ["anvil:mainnet"]
enable_gasp_sync = true
# gasp_sync_interval_secs = 1800   # interval between federation sync passes
# gasp_sync_run_timeout_secs = 600  # maximum duration of one complete GASP sync run
# advertise_interval_secs = 1800   # interval between SHIP/SLAP advertisement reconciliations
# ship_trackers = ["https://overlay-us-1.bsvb.tech"]
# slap_trackers = ["https://overlay-us-1.bsvb.tech"]
# named_peers = ["https://overlay-a.example.com", "https://overlay-b.example.com"]
# Closed-network mode: when set, GASP sync (every topic), lookup federation,
# submit propagation, and SHIP/SLAP resolution all target only these peers,
# regardless of whether [node] public_url is set below -- this is how a node
# peers with named nodes and keeps GASP catch-up working with no public_url
# at all. ship_trackers / slap_trackers and the built-in public defaults are
# not consulted, and the baked-in Anvil header-fallback peer (see [bsv]
# above) is not appended either. The SHIP/SLAP advertiser never runs while
# named_peers is set, even if public_url is also set -- an advert still
# broadcasts through ARC to the public network, which would permanently
# link this node's identity on-chain. Leave unset (the default) for the
# normal federated-overlay behavior.

[mempool]
enabled = false                    # opt in to P2P mempool monitoring
# prefixes = []                    # coverage bytes (0-255); empty selects automatically
# max_tx_size = 1048576            # maximum transaction size to index
# ttl_seconds = 3600               # age before an unconfirmed entry is evicted

[envelopes]
max_ephemeral_ttl = 3600
max_durable_size = 65536
max_durable_store_mb = 10240
warn_at_percent = 80

# BRC-31 MessageBox store — the per-recipient inbox used by /sendMessage,
# /listMessages, /acknowledgeMessage and the mesh forward-relay path.
[messaging]
# require_sender_certificate = false
# With this switch or gateway.allow_registration on, this node asks every
# BRC-31 client for a certificate during the shared handshake. A client without
# one cannot authenticate to any BRC-31 route on this node, including message
# reads. A send from an identity without a current admission gets HTTP 403.
# ttl_seconds = 604800              # how long a stored message lives before expiry (default 7 days)
# max_pair_messages = 1000          # cap on messages between one sender/recipient pair
# max_pair_bytes = 67108864         # cap on bytes between one sender/recipient pair (default 64 MiB)
# max_inbox_messages = 0            # cap on one recipient's whole inbox (0 = unlimited)
# max_inbox_bytes = 0               # cap on one recipient's whole inbox, in bytes (0 = unlimited)
# max_store_messages = 1000000      # cap on messages across the whole store
# max_store_bytes = 2147483648      # cap on bytes across the whole store (default 2 GiB)
#
# Messaging privacy (home-aware store/relay, forward scoping, operator
# box access). See docs/operator/messaging-privacy.md for the full model.
#
# home_hosts lists the public host(s) this node is the HOME for, in
# addition to [node] public_url below. A recipient is "Home" on this
# node when ANY of its current (live, unrevoked) tm_messagebox adverts
# names one of these hosts — not just the newest one; "Elsewhere" when
# every current advert names a different host; "Unadvertised" when it
# has no current advert at all (or this node doesn't host
# tm_messagebox / ls_messagebox). Only https:// hosts qualify;
# localhost, 127.0.0.1, 0.0.0.0, ::1 and *.local / *.example.com /
# *.test / *.invalid / *.localhost never make a recipient Home or
# Elsewhere — note *.example.com is itself excluded, so don't copy that
# TLD into a real home_hosts/public_url entry.
# home_hosts = ["https://my-anvil.example.org"]
#
# forward_copy_ttl controls how long a forwarded copy — stored for a
# recipient who is Elsewhere or Unadvertised — lives in this node's
# store, as opposed to a Home copy, which always keeps the full
# ttl_seconds above. Must be below ttl_seconds (clamped down if not).
# 0 means a forwarded copy is relayed but never stored at all.
# BEHAVIOR CHANGE: before messaging privacy, a forwarded copy was kept
# for the full ttl_seconds (7 days by default), the same as a Home
# copy. The default below (86400 = 24 hours) is shorter; set it higher
# to restore the old retention.
# forward_copy_ttl = 86400
#
# forward_peers restricts mesh message-forwarding to only these peer
# identity public keys (hex). Leave unset (the default) to forward to
# every connected peer, as today. Combine with [mesh] allowed_peers and
# forward_copy_ttl = 0 to run a closed messaging network that relays
# traffic for its members without ever storing a copy it's not the
# home for.
# forward_peers = [
#   "0231600bb272175e990e1639cba5c8f0a8e8c820c7c1b446d2301b0950957f9f66",
# ]
#
# operator_reads_all_boxes controls whether the node operator's own API
# token (any token that is not a per-recipient scoped token) can list
# or acknowledge messages in ANY recipient's box, or only this node's
# own identity box. Default true (today's behavior, unchanged). Set
# false to restrict the operator token to its own box — naming another
# recipient then gets a 403.
# operator_reads_all_boxes = true   # new gateway deploys write false to limit the operator token
# Forwarded messages are accepted from admitted mesh peers. The origin
# attestation is the peer's vouch for the sender; receivers do not repeat the
# sender's certificate check.

# Version tracking for /content: the BRC-159 token chains that start at a set
# of origins, followed so /content/<origin>?seq=N serves an origin's spend
# sequence (0 is the origin, N counts every later location including plain
# transfers, and -1 is the current location). A plain location serves the most
# recent inscription at or before it. A gateway also follows the origins its
# sites file allows. On a node that
# tracks origins, a POST /broadcast that verifiably moves a tracked origin's
# current tip to a new 1-sat output is accepted without a token or payment;
# every other broadcast is gated as before. Versions are kept in
# <data_dir>/ordtrack. With no track_origins and [gateway] off, nothing is
# tracked and nothing changes.
# [content]
# track_origins = ["<txid>_0"]     # origins to follow ("txid_vout" or "txid.vout")
# max_tracked_origins = 1000       # cap on the tracked set
# max_watched_outpoints = 10000    # cap on the outpoints the spend watch follows
# spend_poll_interval = 600        # seconds between WhatsOnChain spent-output lookups of one outpoint (±20%; 1 request/s overall)
# tip_pending_timeout = 86400      # seconds an unmined tip may stay unmined before it is rolled back

[api]
# auth_token is auto-derived from identity.wif — you don't need to set it.
# If you want a custom token, set it here (overrides the derived one).
# auth_token = ""
tls_cert = ""                     # path to TLS cert (or use reverse proxy)
tls_key = ""                      # path to TLS key
rate_limit = 100                  # requests/second per IP for open reads
trust_proxy = false               # set true behind nginx/caddy
# messagebox_rate_limit = 20       # BRC-31 messagebox requests/second per client
# messagebox_rate_burst = 40       # BRC-31 messagebox burst allowance
# trust_proxy reads only X-Forwarded-For (not X-Real-IP or Forwarded); the
# proxy must send that header. trust_proxy_hops counts entries from the
# right: 1 for one proxy (the default). Behind a CDN plus a local proxy, set
# trust_proxy = true and trust_proxy_hops = 2.
# trust_proxy_hops = 1
payment_satoshis = 0              # x402 price per request (0 = free, experimental)
# require_mempool = false          # require ARC acceptance before direct proof payment succeeds
# endpoint_prices = { "/broadcast" = 0 } # per-route overrides, in satoshis
# explorer_origin = ""             # fallback origin used when the explorer catalog is empty
# nonce_pool_size = 100            # proof-scheme nonce target; used only when that scheme is on
# false is the default: no challenge coin is minted. An unpaid request gets
# ERR_PAYMENT_REQUIRED; X402-Proof gets ERR_PROOF_PAYMENT_UNAVAILABLE instead
# of verification. Set x402_proof_scheme = true only for deprecated development use.
x402_proof_scheme = false

# Process-wide nonce mint budget, used only when x402_proof_scheme is on. It
# applies on a charging node and on a free node with an app-priced topic. 0 or
# unset on either key below → the compiled-in default: 10 burst, 2/minute.
# Worst-case mints in any T minutes = x402_mint_burst + x402_mints_per_minute*T,
# so in one hour: x402_mint_burst + x402_mints_per_minute*60. At the default
# (10, 2) that is 130 mint attempts/hour. The bound is on attempts, not sats:
# every successful mint locks 1 sat, but wallet input fragmentation can make
# its transaction fee larger than the examples in payment_budget.go. At most
# 4 wallet mints run concurrently, and each ends with its request or after 10s.
# Each key is bounded: a negative value is a configuration error, and a value
# above its ceiling (1000 burst, 60/minute) takes the ceiling with a warning;
# the budget in effect is logged at startup. At the ceilings one
# uninterrupted process starts at most 4,600 mint attempts in an hour. A
# restart or another process has its own budget.
x402_mint_burst = 10               # mints allowed at once before the per-minute rate applies
x402_mints_per_minute = 2          # sustained mint rate once the burst is spent

# Non-custodial app payment models.
# These control which payment flows third-party apps can use.
# All are safe by default — the node never holds or forwards funds.
# See docs/NON_CUSTODIAL_PAYMENT_POLICY.md for the full policy.
[api.app_payments]
allow_passthrough = true          # Model 2: app sets its own payee script
allow_split = true                # Model 3: atomic dual-pay (node + app)
allow_token_gating = true         # Model 4: credential-based access (no payment)
max_app_price_sats = 10000        # cap on app-declared prices (0 = no cap)

# Operator-defined entries added to /.well-known/anvil. Each table is freeform.
# [[capabilities.custom]]
# type = "example-service"
# description = "Operator-provided capability"

# HARDCODED PROHIBITIONS (not configurable — no code path exists):
# - receive_and_forward = PROHIBITED (money transmission)
# - hold_on_behalf = PROHIBITED (custodial)
# - revenue_share_via_wallet = PROHIBITED (money transmission)
